<html>
    <head>
        <title>How to use Variables</title>
    </head>
    <body>
        <h1>Javascript Variables</h1>
        <p>Sum Of Two Numbers</p>
        <p id="result"></p>
        <script>
            var num1,num2,sum;
            num1=5;
            num2=6;
            sum=num1+num2;
            document.getElementById("result") .innerHTML = "The sum of two numbers is:"+ sum;
        </script>
    </body>
</html>
